# Запуск одной командой:  docker compose up -d --build   →  http://localhost/
# Без файла .env система работает в упрощённом режиме (правила вместо Jev, шаблонные досье).
# Закрытый контур (без облачных моделей):  docker compose --profile offline up -d --build  — см. deploy/DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signals
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signals}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://signals:${POSTGRES_PASSWORD:-signals}@db:5432/signals
    volumes:
      - cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Локальная LLM для закрытого контура (Qwen3 из списка разрешённых моделей). В .env:
  # LLM_PROVIDER=openai, OPENAI_BASE_URL=http://ollama:11434/v1, OPENAI_API_KEY=local, OPENAI_MODEL=qwen3:8b
  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["offline"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  cache:
  ollama:
